services:
  _defaults:
    autowire: true
    autoconfigure: true

  EuF\PortfolioBundle\EventListener\:
    resource: '../../EventListener/*'
    exclude:
      - '../../EventListener/DataContainer/MissingLanguageIconListener.php'
      - '../../EventListener/DataContainer/PortfolioChildTableListener.php'
      - '../../EventListener/LoadDataContainerListener.php'

  EuF\PortfolioBundle\EventListener\BackendAssetsListener:
    tags:
      - { name: 'kernel.event_listener', event: 'kernel.request' }

  EuF\PortfolioBundle\Picker\:
    resource: '../../Picker/*'
